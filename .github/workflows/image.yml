# Publishes the Docker image to GitHub's registry on every push to main, so a
# hosting panel can run pubky-mcp without building it. Everything else is a runtime
# setting (PUBLIC_URL, SESSION_ENCRYPTION_KEY, ALLOWED_HOMESERVERS): one image serves any of them.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pastagringo/pubky-mcp:latest
            ghcr.io/pastagringo/pubky-mcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
